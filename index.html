<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ふたりの旅マップ</title>
<style>
:root {
  --green: #1D9E75; --green-l: #9FE1CB; --green-d: #085041;
  --amber: #EF9F27; --amber-l: #FAEEDA; --amber-d: #854F0B;
  --sea: #c8e8f0;
  --bg: #f4f3ef; --surface: #fff;
  --bd: rgba(0,0,0,.10); --bd2: rgba(0,0,0,.18);
  --tx: #1a1a1a; --tx2: #666; --tx3: #aaa;
  --r: 12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif;background:var(--bg);color:var(--tx);height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.header{padding:10px 14px;background:var(--surface);border-bottom:.5px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.header h1{font-size:15px;font-weight:600}
.stats{font-size:11px;color:var(--tx2);margin-top:2px}
.stats .v{color:var(--green);font-weight:600}.stats .w{color:var(--amber);font-weight:600}
.btn-sh{background:var(--bg);border:.5px solid var(--bd2);border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;color:var(--tx);font-family:inherit}
.tabs{display:flex;background:var(--surface);border-bottom:.5px solid var(--bd);flex-shrink:0}
.tab{flex:1;padding:9px 4px;text-align:center;font-size:12px;cursor:pointer;color:var(--tx2);border-bottom:2px solid transparent;user-select:none}
.tab.active{color:var(--green);border-bottom-color:var(--green);font-weight:600}
.view{flex:1;overflow:hidden;display:none;flex-direction:column}
.view.active{display:flex}
#map-wrap{flex:1;overflow:hidden;position:relative;background:var(--sea)}
#map-svg{width:100%;height:100%}
.pref{cursor:pointer;transition:opacity .15s}
.pref:hover{opacity:.72}
.pref-lbl{pointer-events:none;font-family:'Hiragino Sans','Yu Gothic UI',sans-serif}
.legend{position:absolute;bottom:10px;left:10px;background:rgba(255,255,255,.92);border:.5px solid var(--bd);border-radius:8px;padding:7px 10px;font-size:10px;display:flex;flex-direction:column;gap:4px}
.lg-row{display:flex;align-items:center;gap:6px}
.lg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.tip{position:absolute;background:var(--surface);border:.5px solid var(--bd2);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;pointer-events:none;display:none;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.list-wrap{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.sh{font-size:11px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 7px;padding-bottom:5px;border-bottom:.5px solid var(--bd)}
.sh:first-child{margin-top:0}
.pc{background:var(--surface);border:.5px solid var(--bd);border-radius:var(--r);margin-bottom:8px;overflow:hidden;display:flex;align-items:stretch;cursor:pointer}
.pc:active{opacity:.75}
.pt{width:68px;height:68px;object-fit:cover;flex-shrink:0}
.pn{width:68px;height:68px;background:var(--bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px}
.pb{flex:1;padding:10px 13px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.pb-name{font-size:15px;font-weight:600}
.pb-date{font-size:11px;color:var(--tx2)}
.pb-memo{font-size:11px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.pb-ph{font-size:10px;color:var(--green)}
.empty{text-align:center;padding:48px 20px;color:var(--tx2);font-size:13px;line-height:2.2}
.wish-wrap{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.wh{font-size:12px;color:var(--tx2);margin-bottom:10px}
.wg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wi{background:var(--surface);border:.5px solid var(--bd);border-radius:9px;padding:10px 6px;text-align:center;cursor:pointer;position:relative;user-select:none}
.wi.on{border-color:var(--amber);background:var(--amber-l)}
.wi.vis{border-color:var(--green)}
.win{font-size:12px;font-weight:600}
.wie{font-size:9px;color:var(--tx3);margin-top:1px}
.wib{position:absolute;top:4px;right:4px;font-size:11px}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:200;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:90dvh;display:flex;flex-direction:column}
.hdl{width:38px;height:4px;background:var(--bd2);border-radius:2px;margin:10px auto 0;flex-shrink:0}
.s-head{padding:13px 15px 11px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--bd);flex-shrink:0}
.s-title{font-size:17px;font-weight:700}
.s-sub{font-size:11px;color:var(--tx2);margin-top:2px}
.s-close{background:var(--bg);border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;color:var(--tx2);display:flex;align-items:center;justify-content:center}
.s-body{flex:1;overflow-y:auto;padding:15px;-webkit-overflow-scrolling:touch}
.fl{font-size:11px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.fr{margin-bottom:14px}
input[type=date],textarea{width:100%;padding:9px 11px;border:.5px solid var(--bd2);border-radius:9px;background:var(--bg);color:var(--tx);font-size:14px;font-family:inherit}
textarea{resize:none;height:70px}
input[type=date]:focus,textarea:focus{outline:none;border-color:var(--green)}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:15px}
.pit{aspect-ratio:1;border-radius:9px;overflow:hidden;position:relative;cursor:pointer;background:var(--bg);border:.5px solid var(--bd)}
.pit img{width:100%;height:100%;object-fit:cover}
.pit.sel{border:2.5px solid var(--green)}
.pit.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1.5px dashed var(--bd2);background:transparent}
.pit.add span{font-size:22px;color:var(--tx3)}
.pit.add p{font-size:9px;color:var(--tx3)}
.pt-b{position:absolute;top:3px;left:3px;background:var(--green);color:#fff;font-size:8px;padding:2px 5px;border-radius:4px;font-weight:700}
.pt-d{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.52);color:#fff;border:none;width:20px;height:20px;border-radius:50%;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ar{display:flex;gap:8px;padding-top:4px}
.bp{flex:1;padding:12px;background:var(--green);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.bp:active{opacity:.85}
.bg{padding:12px 14px;background:var(--bg);color:var(--tx2);border:.5px solid var(--bd2);border-radius:9px;font-size:13px;cursor:pointer;font-family:inherit}
.sc{background:var(--bg);border-radius:var(--r);padding:14px;margin-bottom:10px;cursor:pointer;border:.5px solid var(--bd)}
.sc:hover{border-color:var(--green)}
.sc-t{font-size:14px;font-weight:700}
.sc-s{font-size:11px;color:var(--tx2);margin-top:3px}
.bc{width:100%;padding:12px;background:transparent;border:.5px solid var(--bd2);border-radius:9px;font-size:14px;cursor:pointer;color:var(--tx2);font-family:inherit;margin-top:4px}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>🗾 ふたりの旅マップ</h1>
    <div class="stats">訪問済み <span class="v" id="vc">0</span>/47 &nbsp;|&nbsp; 行きたい <span class="w" id="wc">0</span></div>
  </div>
  <button class="btn-sh" id="btn-share">共有・保存</button>
</div>
<div class="tabs">
  <div class="tab active" data-tab="map">🗾 地図</div>
  <div class="tab" data-tab="list">📋 一覧</div>
  <div class="tab" data-tab="wish">⭐ 行きたい</div>
</div>

<div class="view active" id="view-map">
  <div id="map-wrap">
    <svg id="map-svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid meet">
      <defs id="svg-defs"></defs>
      <g id="pref-g"></g>
      <g id="lbl-g"></g>
    </svg>
    <div class="tip" id="tip"></div>
    <div class="legend">
      <div class="lg-row"><div class="lg-dot" style="background:var(--green-l);border:1px solid var(--green)"></div>訪問済み</div>
      <div class="lg-row"><div class="lg-dot" style="background:var(--amber-l);border:1px solid var(--amber)"></div>行きたい</div>
      <div class="lg-row"><div class="lg-dot" style="background:#daeef4;border:1px solid #a0c8d4"></div>未訪問</div>
    </div>
  </div>
</div>

<div class="view" id="view-list"><div class="list-wrap" id="list-wrap"></div></div>

<div class="view" id="view-wish">
  <div class="wish-wrap">
    <div class="wh">タップして行きたい都道府県を登録しよう ⭐</div>
    <div class="wg" id="wish-grid"></div>
  </div>
</div>

<!-- 都道府県モーダル -->
<div class="ov" id="pref-ov">
  <div class="sheet">
    <div class="hdl"></div>
    <div class="s-head">
      <div><div class="s-title" id="m-name"></div><div class="s-sub" id="m-en"></div></div>
      <button class="s-close" id="m-close">✕</button>
    </div>
    <div class="s-body">
      <div class="fr"><div class="fl">旅行日</div><input type="date" id="m-date"></div>
      <div class="fr"><div class="fl">メモ</div><textarea id="m-memo" placeholder="思い出を残しておこう..."></textarea></div>
      <div class="fr">
        <div class="fl">写真 <span id="m-pc" style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--tx3);font-size:11px"></span></div>
        <div class="pg" id="m-photos"></div>
        <input type="file" id="m-file" accept="image/*" multiple style="display:none">
      </div>
      <div class="ar"><button class="bg" id="m-del">削除</button><button class="bp" id="m-save">保存する</button></div>
    </div>
  </div>
</div>

<!-- 共有モーダル -->
<div class="ov" id="share-ov">
  <div class="sheet">
    <div class="hdl"></div>
    <div class="s-body" style="padding:18px">
      <div style="font-size:16px;font-weight:700;margin-bottom:4px">共有・保存</div>
      <div style="font-size:12px;color:var(--tx2);margin-bottom:16px">旅の記録をシェアしよう</div>
      <div class="sc" id="sh-text"><div class="sc-t">📝 旅の記録をテキストでコピー</div><div class="sc-s">訪問した県・日付・メモをまとめてコピー。LINEなどに貼り付けられます</div></div>
      <div class="sc" id="sh-ss"><div class="sc-t">🗾 地図をスクリーンショットで保存</div><div class="sc-s">スマホ：ホーム＋電源 / Mac：⌘+Shift+4 / Win：Win+Shift+S</div></div>
      <button class="bc" id="sh-close">キャンセル</button>
    </div>
  </div>
</div>

// ラベル位置（centroid相当）
const LABEL_POS = {};
PREFS.forEach(p => { LABEL_POS[p.id] = {x: p.lx, y: p.ly}; });

function dispName(p) {
  if(p.id==='hokkaido') return '北海道';
  if(p.id==='tokyo') return '東京都';
  if(['osaka','kyoto'].includes(p.id)) return p.name+'府';
  return p.name+'県';
}

// ===== ストレージ =====
let prefData={}, wishList={};
function load(){try{const r=localStorage.getItem('jtm');if(r){const d=JSON.parse(r);prefData=d.p||{};wishList=d.w||{}}}catch(e){}}
function save(){try{localStorage.setItem('jtm',JSON.stringify({p:prefData,w:wishList}))}catch(e){}}
function isVis(id){const d=prefData[id];return !!(d&&(d.photos?.length||d.date||d.memo))}
function updateCounts(){
  document.getElementById('vc').textContent=PREFS.filter(p=>isVis(p.id)).length;
  document.getElementById('wc').textContent=Object.keys(wishList).filter(k=>wishList[k]).length;
}

// ===== 地図描画 =====
function drawMap(){
  const g=document.getElementById('pref-g');
  const lg=document.getElementById('lbl-g');
  const defs=document.getElementById('svg-defs');
  g.innerHTML=''; lg.innerHTML=''; defs.innerHTML='';

  PREFS.forEach(p=>{
    const d=prefData[p.id]||{};
    const vis=isVis(p.id), wish=wishList[p.id];
    const pathD=PATHS[p.id]; if(!pathD) return;

    if(vis && d.thumbnail){
      // クリップパスで写真を県形に切り抜き
      const cid='clip-'+p.id;
      const clip=document.createElementNS('http://www.w3.org/2000/svg','clipPath');
      clip.setAttribute('id',cid);
      const cp=document.createElementNS('http://www.w3.org/2000/svg','path');
      cp.setAttribute('d',pathD); clip.appendChild(cp); defs.appendChild(clip);

      // SVGのbbox計算（一時追加して計算）
      const tmp=document.createElementNS('http://www.w3.org/2000/svg','path');
      tmp.setAttribute('d',pathD);
      const svgEl=document.getElementById('map-svg');
      svgEl.appendChild(tmp);
      let bb; try{bb=tmp.getBBox();}catch(e){bb={x:100,y:100,width:60,height:60};}
      svgEl.removeChild(tmp);

      // ベース色
      const bg=document.createElementNS('http://www.w3.org/2000/svg','path');
      bg.setAttribute('d',pathD); bg.setAttribute('fill','#1D9E75');
      bg.setAttribute('stroke','#0a5c40'); bg.setAttribute('stroke-width','1');
      g.appendChild(bg);

      // 写真
      const img=document.createElementNS('http://www.w3.org/2000/svg','image');
      img.setAttribute('href',d.thumbnail);
      img.setAttribute('x',bb.x); img.setAttribute('y',bb.y);
      img.setAttribute('width',bb.width); img.setAttribute('height',bb.height);
      img.setAttribute('preserveAspectRatio','xMidYMid slice');
      img.setAttribute('clip-path',`url(#${cid})`);
      g.appendChild(img);

      // クリック用透明パス
      const ov=document.createElementNS('http://www.w3.org/2000/svg','path');
      ov.setAttribute('d',pathD); ov.setAttribute('fill','transparent');
      ov.setAttribute('stroke','#0a5c40'); ov.setAttribute('stroke-width','1');
      ov.setAttribute('class','pref');
      ov.addEventListener('click',()=>openModal(p));
      ov.addEventListener('mousemove',ev=>showTip(ev,dispName(p)));
      ov.addEventListener('mouseleave',hideTip);
      g.appendChild(ov);
    } else {
      const fill = vis ? '#9FE1CB' : wish ? '#FAEEDA' : '#daeef4';
      const stroke = vis ? '#1D9E75' : wish ? '#EF9F27' : '#a0c8d4';
      const sw = (vis||wish) ? 1.2 : 0.5;
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',pathD); path.setAttribute('fill',fill);
      path.setAttribute('stroke',stroke); path.setAttribute('stroke-width',sw);
      path.setAttribute('class','pref');
      path.addEventListener('click',()=>openModal(p));
      path.addEventListener('mousemove',ev=>showTip(ev,dispName(p)));
      path.addEventListener('mouseleave',hideTip);
      g.appendChild(path);
    }

    // ラベル
    const lp=LABEL_POS[p.id];
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',lp.x); t.setAttribute('y',lp.y);
    t.setAttribute('text-anchor','middle'); t.setAttribute('dominant-baseline','middle');
    t.setAttribute('class','pref-lbl');
    const area = estimateArea(pathD);
    t.setAttribute('font-size', area > 3000 ? 9 : area > 800 ? 7.5 : 6.5);
    t.setAttribute('fill', vis&&d.thumbnail?'white': vis?'#085041': wish?'#854F0B':'#4a7a88');
    t.setAttribute('font-weight', vis?'700':'500');
    t.setAttribute('pointer-events','none');
    t.textContent=p.name;
    lg.appendChild(t);
  });
}

function estimateArea(d){
  // パスのおおよその面積をバウンディングボックスから推定
  const nums=d.match(/[\d.]+/g).map(Number);
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(let i=0;i<nums.length-1;i+=2){
    if(nums[i]<minX)minX=nums[i]; if(nums[i]>maxX)maxX=nums[i];
    if(nums[i+1]<minY)minY=nums[i+1]; if(nums[i+1]>maxY)maxY=nums[i+1];
  }
  return (maxX-minX)*(maxY-minY);
}

// Tooltip
function showTip(ev,name){
  const tip=document.getElementById('tip');
  const wrap=document.getElementById('map-wrap');
  const rect=wrap.getBoundingClientRect();
  tip.textContent=name; tip.style.display='block';
  let x=ev.clientX-rect.left+12, y=ev.clientY-rect.top-36;
  if(x+130>rect.width) x=ev.clientX-rect.left-140;
  if(y<0) y=ev.clientY-rect.top+14;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip(){document.getElementById('tip').style.display='none';}

// ===== 一覧 =====
function renderList(){
  const wrap=document.getElementById('list-wrap');
  const vis=PREFS.filter(p=>isVis(p.id));
  const wish=PREFS.filter(p=>wishList[p.id]&&!isVis(p.id));
  if(!vis.length&&!wish.length){wrap.innerHTML='<div class="empty">まだ記録がありません 🗺️<br>地図をタップして旅の思い出を残そう！</div>';return;}
  let html='';
  if(vis.length){
    html+=`<div class="sh">訪問済み (${vis.length})</div>`;
    vis.sort((a,b)=>(prefData[b.id]?.date||'').localeCompare(prefData[a.id]?.date||'')).forEach(p=>{
      const d=prefData[p.id];
      const th=d.thumbnail?`<img class="pt" src="${d.thumbnail}">`:`<div class="pn">🗾</div>`;
      const ds=d.date?new Date(d.date+'T00:00:00').toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'}):'';
      html+=`<div class="pc" onclick="openById('${p.id}')">${th}<div class="pb"><div class="pb-name">${dispName(p)}</div>${ds?`<div class="pb-date">${ds}</div>`:''}${d.memo?`<div class="pb-memo">${d.memo}</div>`:''}${d.photos?.length?`<div class="pb-ph">写真 ${d.photos.length}枚</div>`:''}</div></div>`;
    });
  }
  if(wish.length){
    html+=`<div class="sh">行きたいリスト (${wish.length})</div>`;
    wish.forEach(p=>{html+=`<div class="pc" onclick="openById('${p.id}')"><div class="pn">⭐</div><div class="pb"><div class="pb-name">${dispName(p)}</div><div class="pb-date" style="color:var(--amber-d)">行きたい！</div></div></div>`;});
  }
  wrap.innerHTML=html;
}

// ===== 行きたい =====
function renderWish(){
  document.getElementById('wish-grid').innerHTML=PREFS.map(p=>{
    const on=wishList[p.id],vis=isVis(p.id);
    return`<div class="wi${on?' on':''}${vis?' vis':''}" onclick="toggleWish('${p.id}')">${on?'<div class="wib">⭐</div>':''}${vis?'<div class="wib" style="color:var(--green)">✓</div>':''}<div class="win">${p.name}</div><div class="wie">${p.en}</div></div>`;
  }).join('');
}
window.toggleWish=id=>{
  wishList[id]=!wishList[id]; if(!wishList[id])delete wishList[id];
  save(); updateCounts(); renderWish(); renderList(); drawMap();
};

// ===== モーダル =====
let curP=null,curPh=[];
window.openById=id=>{const p=PREFS.find(x=>x.id===id);if(p)openModal(p);};

function openModal(pref){
  curP=pref; const d=prefData[pref.id]||{};
  curPh=(d.photos||[]).map(x=>({...x}));
  document.getElementById('m-name').textContent=dispName(pref);
  document.getElementById('m-en').textContent=pref.en;
  document.getElementById('m-date').value=d.date||'';
  document.getElementById('m-memo').value=d.memo||'';
  renderPhotos();
  document.getElementById('pref-ov').classList.add('open');
}

function renderPhotos(){
  const grid=document.getElementById('m-photos');
  const tid=(prefData[curP.id]||{}).thumbnailId;
  grid.innerHTML='';
  document.getElementById('m-pc').textContent=curPh.length?`${curPh.length}枚`:'';
  curPh.forEach((ph,i)=>{
    const div=document.createElement('div');
    div.className='pit'+(ph.id===tid?' sel':'');
    const img=document.createElement('img');img.src=ph.data;div.appendChild(img);
    if(ph.id===tid){const b=document.createElement('div');b.className='pt-b';b.textContent='サムネ';div.appendChild(b);}
    const del=document.createElement('button');del.className='pt-d';del.textContent='×';
    del.onclick=e=>{e.stopPropagation();curPh.splice(i,1);renderPhotos();};
    div.appendChild(del);
    div.onclick=()=>{if(!prefData[curP.id])prefData[curP.id]={};prefData[curP.id].thumbnailId=ph.id;prefData[curP.id].thumbnail=ph.data;renderPhotos();};
    grid.appendChild(div);
  });
  const add=document.createElement('div');add.className='pit add';
  add.innerHTML='<span>+</span><p>写真を追加</p>';
  add.onclick=()=>document.getElementById('m-file').click();
  grid.appendChild(add);
}

document.getElementById('m-file').addEventListener('change',e=>{
  Array.from(e.target.files).forEach(f=>{
    const r=new FileReader();r.onload=ev=>{curPh.push({id:Date.now()+Math.random(),data:ev.target.result});renderPhotos();};r.readAsDataURL(f);
  });e.target.value='';
});

document.getElementById('m-save').addEventListener('click',()=>{
  if(!prefData[curP.id])prefData[curP.id]={};
  const d=prefData[curP.id];
  d.date=document.getElementById('m-date').value;
  d.memo=document.getElementById('m-memo').value;
  d.photos=curPh;
  if(!d.thumbnailId&&curPh.length){d.thumbnailId=curPh[0].id;d.thumbnail=curPh[0].data;}
  if(d.thumbnailId){const f=curPh.find(x=>x.id===d.thumbnailId);if(f)d.thumbnail=f.data;else if(curPh.length){d.thumbnailId=curPh[0].id;d.thumbnail=curPh[0].data;}else{d.thumbnail=null;d.thumbnailId=null;}}
  save();updateCounts();drawMap();renderList();renderWish();
  document.getElementById('pref-ov').classList.remove('open');
});

document.getElementById('m-del').addEventListener('click',()=>{
  if(confirm(dispName(curP)+'の記録を削除しますか？')){
    delete prefData[curP.id];save();updateCounts();drawMap();renderList();renderWish();
    document.getElementById('pref-ov').classList.remove('open');
  }
});
document.getElementById('m-close').addEventListener('click',()=>document.getElementById('pref-ov').classList.remove('open'));
document.getElementById('pref-ov').addEventListener('click',e=>{if(e.target===document.getElementById('pref-ov'))document.getElementById('pref-ov').classList.remove('open');});

// ===== 共有 =====
document.getElementById('btn-share').addEventListener('click',()=>document.getElementById('share-ov').classList.add('open'));
document.getElementById('sh-close').addEventListener('click',()=>document.getElementById('share-ov').classList.remove('open'));
document.getElementById('share-ov').addEventListener('click',e=>{if(e.target===document.getElementById('share-ov'))document.getElementById('share-ov').classList.remove('open');});
document.getElementById('sh-text').addEventListener('click',()=>{
  const vis=PREFS.filter(p=>isVis(p.id));
  if(!vis.length){alert('まだ訪問済みの記録がありません');return;}
  let t='🗾 ふたりの旅記録\n訪問済み: '+vis.length+' / 47 都道府県\n\n';
  vis.sort((a,b)=>(prefData[a.id]?.date||'').localeCompare(prefData[b.id]?.date||'')).forEach(p=>{
    const d=prefData[p.id];t+='📍 '+dispName(p)+'\n';
    if(d.date)t+='   日付: '+new Date(d.date+'T00:00:00').toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'})+'\n';
    if(d.memo)t+='   メモ: '+d.memo+'\n';
    if(d.photos?.length)t+='   写真: '+d.photos.length+'枚\n';t+='\n';
  });
  const wl=PREFS.filter(p=>wishList[p.id]);
  if(wl.length){t+='\n⭐ 行きたいリスト ('+wl.length+'件)\n';wl.forEach(p=>{t+='   '+dispName(p)+'\n';});}
  navigator.clipboard.writeText(t).then(()=>{alert('コピーしました！');document.getElementById('share-ov').classList.remove('open');}).catch(()=>prompt('コピーしてください:',t));
});
document.getElementById('sh-ss').addEventListener('click',()=>{
  alert('スマホ：ホーム＋電源ボタン\nMac：⌘+Shift+4\nWindows：Win+Shift+S');
  document.getElementById('share-ov').classList.remove('open');
});

// ===== タブ =====
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-'+tab.dataset.tab).classList.add('active');
    if(tab.dataset.tab==='list')renderList();
    if(tab.dataset.tab==='wish')renderWish();
  });
});

// ===== 初期化 =====
load(); updateCounts(); drawMap(); renderWish();
</script>
</body>
